# Public fork: Dependabot opens PRs but never triggers upstream PyPI publishing.
# Inherited version/package naming and upstream attribution remain unchanged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "07:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      python-patch:
        update-types: [patch]
  - package-ecosystem: npm
    directory: /typescript
    schedule:
      interval: weekly
      day: wednesday
      time: "07:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      typescript-patch:
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "07:25"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      actions-maintenance:
        patterns: ["*"]
