name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# PES-10 (fork maintenance): least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  check-sqlite:
    name: Tests (SQLite, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Import check
        run: python -c "from hevy2garmin.hevy import HevyClient; from hevy2garmin.mapper import lookup_exercise; from hevy2garmin.fit import generate_fit; print('OK')"

      - name: CLI check
        run: hevy2garmin --help

      - name: Run tests
        run: python -m pytest tests/ -v

  check-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hevy2garmin_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with cloud + dev dependencies
        run: pip install -e ".[dev,cloud]"

      - name: Run tests with Postgres backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/hevy2garmin_test
        run: python -m pytest tests/ -v
